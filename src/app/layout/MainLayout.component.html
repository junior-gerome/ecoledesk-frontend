@if (loadingService.isLoading()) {
  <div
    class='pointer-events-none fixed inset-x-0 top-0 z-[100] h-1 overflow-hidden bg-primary-100/80'
    aria-live='polite'
    aria-busy='true'
  >
    <div class='h-full w-2/5 animate-pulse bg-primary-600'></div>
  </div>
}

<div class='flex min-h-screen bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-50'>
  <app-sidebar />

  <div
    class='mainlayout-content flex min-h-screen flex-1 flex-col'
    [class.sidebar-collapsed]='layoutService.sidebarCollapsed()'
  >
    <header class='sticky top-0 z-20 flex h-16 items-center border-b border-slate-200/80 bg-white/85 px-4 shadow-sm shadow-slate-200/60 backdrop-blur-xl dark:border-slate-800/80 dark:bg-slate-950/80 dark:shadow-black/10 sm:px-6'>
      <button
        type='button'
        (click)='layoutService.toggleSidebar()'
        class='mr-3 inline-flex h-11 w-11 flex-none items-center justify-center rounded-xl text-slate-600 transition-colors duration-200 hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-primary-500/40 lg:hidden dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white'
        [attr.aria-label]='(layoutService.sidebarOpen() ? sidebarCloseLabel : sidebarOpenLabel) | translate'
        [attr.aria-expanded]='layoutService.sidebarOpen()'
        aria-controls='primary-sidebar'
      >
        <span class='text-2xl leading-none'>&#8801;</span>
      </button>
      <app-nav class='flex-1' />
    </header>

    <main class='flex-1 overflow-x-hidden px-4 py-6 sm:px-6 lg:px-8'>
      <router-outlet />
    </main>
  </div>
</div>
