<button
  type="button"
  (click)="toggle()"
  class="inline-flex h-10 items-center gap-1.5 rounded-md bg-white px-3 text-sm font-medium text-slate-600 ring-1 ring-slate-200 transition hover:bg-slate-50 hover:text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-slate-900 dark:text-slate-300 dark:ring-slate-700 dark:hover:bg-slate-800"
  [attr.aria-label]="'settings.language' | translate"
>
  <span class="text-base leading-none">{{ currentFlag() }}</span>
  <span class="hidden sm:inline">{{ currentLabel() }}</span>
  <svg class="h-3.5 w-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
  </svg>
</button>
