@if (open) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" (click)="onBackdropClick($event)">
    <div #panel [class]="panelClasses" role="dialog" aria-modal="true" [attr.aria-labelledby]="title ? 'modal-title' : null" tabindex="-1">
      @if (title || showCloseButton) {
        <div class="flex items-center justify-between border-b border-gray-200 px-6 py-4 dark:border-slate-700">
          <h2 id="modal-title" class="text-lg font-semibold text-gray-900 dark:text-gray-100">{{ title || 'Details' }}</h2>
          @if (showCloseButton) { <button type="button" class="rounded-md p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-gray-300 dark:hover:bg-slate-700 dark:hover:text-gray-100" aria-label="Fermer la fenêtre" (click)="requestClose()">×</button> }
        </div>
      }
      <div class="p-6"><ng-content></ng-content></div>
      @if (showFooter) { <div class="border-t border-gray-200 px-6 py-4 dark:border-slate-700"><ng-content select="[modal-footer]"></ng-content></div> }
    </div>
  </div>
}
