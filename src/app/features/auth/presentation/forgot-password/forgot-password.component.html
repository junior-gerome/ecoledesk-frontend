<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-slate-950 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <div class="flex justify-center mb-6">
        <img
          src="assets/images/logo-school.png"
          [alt]="'auth.logoAlt' | translate"
          class="h-20 w-20 object-contain"
        />
      </div>

      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900 dark:text-white">
        {{ 'auth.forgotTitle' | translate }}
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-400">
        {{ 'auth.forgotSubtitle' | translate }}
      </p>
    </div>

    @if (error) {
      <app-alert type="error" [message]="error" />
    }

    @if (success) {
      <app-alert type="success" [message]="success" />
    }

    <form class="mt-8 space-y-6" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <app-input
        [label]="'auth.email' | translate"
        id="email"
        type="email"
        formControlName="email"
        [control]="forgotPasswordForm.get('email')"
        [placeholder]="'auth.emailPlaceholder' | translate"
        [errorMessages]="{
          required: 'auth.emailRequired' | translate,
          email: 'auth.emailInvalid' | translate
        }"
      />

      <app-button type="submit" variant="primary" [loading]="isLoading" [fullWidth]="true"
        [disabled]="forgotPasswordForm.invalid || isLoading">
        {{ isLoading ? ('auth.forgotSending' | translate) : ('auth.forgotSend' | translate) }}
      </app-button>

      <div class="text-center">
        <a routerLink="/auth/login" class="font-medium text-primary-600 hover:text-primary-500">
          {{ 'auth.backToLogin' | translate }}
        </a>
      </div>
    </form>
  </div>
</div>
