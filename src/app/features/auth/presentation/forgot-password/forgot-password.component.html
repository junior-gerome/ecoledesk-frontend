<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        {{ 'auth.forgotTitle' | translate }}
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        {{ 'auth.forgotSubtitle' | translate }}
      </p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <div class="flex justify-center">
        <app-input
          [label]="'auth.email' | translate"
          id="email"
          type="email"
          formControlName="email"
          [placeholder]="'auth.emailPlaceholder' | translate"
        />
      </div>

      <div class="flex justify-center">
        <app-button type="submit" variant="primary" [disabled]="forgotPasswordForm.invalid || isLoading">
          <span *ngIf="isLoading" class="mr-2">{{ 'auth.forgotSending' | translate }}</span>
          <span *ngIf="!isLoading">{{ 'auth.forgotSend' | translate }}</span>
        </app-button>
      </div>

      <div class="text-center">
        <a routerLink="/auth/login" class="font-medium text-primary-600 hover:text-primary-500">
          {{ 'auth.backToLogin' | translate }}
        </a>
      </div>
    </form>

    <div *ngIf="error" class="mt-4 text-center text-sm text-red-600">{{ error }}</div>
    <div *ngIf="success" class="mt-4 text-center text-sm text-green-600">{{ success }}</div>
  </div>
</div>
