<div class="min-h-screen flex bg-gray-50 dark:bg-slate-950">

  <!-- Partie gauche : Image / Illustration école -->
     <div class="hidden lg:flex lg:w-1/2 relative bg-primary-600 items-center justify-center overflow-hidden">

  <app-school-illustration/> 
</div>

  <!-- Partie droite : Formulaire Login -->
  <div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-12">

      <div class="max-w-md w-full space-y-8">

        <div>
          <div class="flex justify-center mb-6">
            <img
              src="assets/images/logo-school.png"
              [alt]="'auth.logoAlt' | translate"
              class="h-20 w-20 object-contain"
            />
          </div>

          <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900 dark:text-white">
            {{ 'auth.login' | translate }}
          </h2>

          <p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-400">
            {{ 'auth.loginSubtitle' | translate }}
          </p>
        </div>

        @if (message) {
          <app-alert type="success" [message]="message" />
        }

        <form
          class="mt-8 space-y-6"
          [formGroup]="loginForm"
          (ngSubmit)="onSubmit()"
        >
          <app-form-body>
            <app-input
              [label]="'auth.email' | translate"
              id="email"
              type="email"
              formControlName="email"
              [control]="loginForm.get('email')"
              [placeholder]="'auth.emailPlaceholder' | translate"
            />

            <app-input
              [label]="'auth.password' | translate"
              id="password"
              type="password"
              formControlName="password"
              [control]="loginForm.get('password')"
              [placeholder]="'auth.passwordPlaceholder' | translate"
            />
          </app-form-body>

          <div class="flex items-center justify-between">
            <div class="text-sm">
              <a routerLink="/auth/forgot-password" class="font-medium text-primary-600 hover:text-primary-500">
                {{ 'auth.forgotPassword' | translate }}
              </a>

              <a routerLink="/auth/register" class="ml-4 font-medium text-primary-600 hover:text-primary-500">
                {{ 'auth.register' | translate }}
              </a>
            </div>
          </div>

          <app-button
            type="submit"
            [disabled]="loginForm.invalid || isLoading"
            [loading]="isLoading"
            [fullWidth]="true"
          >
            {{ isLoading ? ('auth.loginLoading' | translate) : ('auth.loginButton' | translate) }}
          </app-button>
        </form>

        @if (error) {
          <app-alert type="error" [message]="error" class="mt-4" />
        }
      </div>

    </div>

</div>
