<app-page-layout>
  <app-page-header [title]="'bulletinPage.selectorTitle' | translate">
    <app-button type="button" variant="secondary" size="sm" routerLink="/grades">
      {{ 'bulletinPage.backToGrades' | translate }}
    </app-button>
  </app-page-header>

  <p class="text-sm text-gray-600 dark:text-gray-300">
    {{ 'bulletinPage.selectorSubtitle' | translate }}
  </p>

  <app-card padding="lg">
    <form [formGroup]="form" class="grid grid-cols-1 gap-4 md:grid-cols-3">
      <app-select
        id="classId"
        formControlName="classId"
        [options]="classOptions"
        [label]="'bulletinPage.class' | translate"
        [placeholder]="'bulletinPage.chooseClass' | translate"
      />

      <app-select
        id="studentId"
        formControlName="studentId"
        [options]="studentOptions"
        [label]="'bulletinPage.student' | translate"
        [placeholder]="loadingStudents
          ? ('bulletinPage.loadingStudents' | translate)
          : ('bulletinPage.chooseStudent' | translate)"
      />

      <app-select
        id="period"
        formControlName="period"
        [options]="periodOptions"
        [label]="'bulletinPage.sequence' | translate"
        [placeholder]="'bulletinPage.chooseSequence' | translate"
      />
    </form>

    <div class="mt-6 flex justify-end">
      <app-button
        type="button"
        variant="primary"
        [disabled]="!form.get('classId')?.value || !form.get('studentId')?.value"
        (click)="openBulletin()"
      >
        {{ 'bulletinPage.openBulletin' | translate }}
      </app-button>
    </div>
  </app-card>

  @if (!form.get('classId')?.value) {
    <app-empty-state
      [title]="'bulletinPage.noClassTitle' | translate"
      [description]="'bulletinPage.noClassDesc' | translate"
      icon="○"
    />
  } @else if (!loadingStudents && studentOptions.length === 0) {
    <app-empty-state
      [title]="'bulletinPage.noStudentTitle' | translate"
      [description]="'bulletinPage.noStudentDesc' | translate"
      icon="○"
    />
  }
</app-page-layout>
