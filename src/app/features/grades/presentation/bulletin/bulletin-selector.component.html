<div class="min-h-screen bg-gray-100 py-6 dark:bg-gray-900">
  <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-semibold text-gray-900 dark:text-gray-100">
          Bulletins individuels
        </h1>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
          Choisissez une classe, un eleve et une sequence pour ouvrir le bulletin.
        </p>
      </div>

      <a
        routerLink="/grades"
        class="inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
      >
        Retour aux notes
      </a>
    </div>

    <div class="rounded-2xl bg-white p-6 shadow dark:bg-gray-800">
      <form [formGroup]="form" class="grid grid-cols-1 gap-4 md:grid-cols-3">
        <div>
          <label
            for="classId"
            class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300"
          >
            Classe
          </label>
          <app-select
            id="classId"
            formControlName="classId"
            [options]="classOptions"
            placeholder="Choisir une classe"
          />
        </div>

        <div>
          <label
            for="studentId"
            class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300"
          >
            Eleve
          </label>
          <app-select
            id="studentId"
            formControlName="studentId"
            [options]="studentOptions"
            [placeholder]="loadingStudents ? 'Chargement des eleves...' : 'Choisir un eleve'"
          />
        </div>

        <div>
          <label
            for="period"
            class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300"
          >
            Sequence
          </label>
          <app-select
            id="period"
            formControlName="period"
            [options]="periodOptions"
            placeholder="Choisir une sequence"
          />
        </div>
      </form>

      <div class="mt-6 flex justify-end">
        <app-button
          type="button"
          variant="primary"
          [disabled]="!form.get('classId')?.value || !form.get('studentId')?.value"
          (click)="openBulletin()"
        >
          Ouvrir le bulletin
        </app-button>
      </div>
    </div>

    @if (!form.get('classId')?.value) {
      <div class="mt-6">
        <app-empty-state
          title="Aucune classe selectionnee"
          description="Commencez par choisir une classe pour afficher la liste des eleves."
          icon="O"
        />
      </div>
    } @else if (!loadingStudents && studentOptions.length === 0) {
      <div class="mt-6">
        <app-empty-state
          title="Aucun eleve disponible"
          description="Cette classe ne contient aucun eleve exploitable pour generer un bulletin."
          icon="O"
        />
      </div>
    }
  </div>
</div>
